name: e24-queue-max-a
# E24: like E6, but with queue: max. Dispatch a, b, a: all three should wait their turn.
on:
  workflow_dispatch:

concurrency:
  group: e24-shared-group
  cancel-in-progress: false
  queue: max

jobs:
  hold:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "e24 a start $(date -u +%T)"; sleep 90
