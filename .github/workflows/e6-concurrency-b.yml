name: e6-concurrency-b
# E6, second workflow in the same concurrency group as e6-concurrency-a.
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        default: b

concurrency:
  group: e6-shared-group
  cancel-in-progress: false

jobs:
  hold:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "e6 b tag=${{ inputs.tag }} start $(date -u +%T)"; sleep 120; echo "end $(date -u +%T)"
